version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: editorial_dashboard_demo
    ports:
      - "8050:8050"
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8050
      - DEMO_MODE=true
    restart: unless-stopped
    networks:
      - dashboard_network

networks:
  dashboard_network:
    driver: bridge