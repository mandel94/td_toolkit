version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: editorial_dashboard
    ports:
      - "8050:8050"
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8050
      - GA4_PROPERTY_ID=394327334
      - GA4_CREDENTIALS_PATH=/app/ga4_api/client_secret_722854453271-t3dg269vqsvjjhbmpkh2a5etk0mmf6ve.apps.googleusercontent.com.json
    env_file:
      - .env
    volumes:
      # Mount data directory if you need access to local data files
      - ./data:/app/data:ro
      # Mount credentials (read-write for token.pickle)
      - ../../ga4_api:/app/ga4_api:rw
    restart: unless-stopped
    networks:
      - dashboard_network

networks:
  dashboard_network:
    driver: bridge
