version: '3.8'

services:
  articles_postgres:
    image: postgres:15
    container_name: articles_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: articles_db
      POSTGRES_USER: articles_user
      POSTGRES_PASSWORD: secure_password_2025
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles_user -d articles_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  adminer:
    image: adminer
    container_name: articles_db_admin
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - articles_postgres
    environment:
      ADMINER_DEFAULT_SERVER: articles_postgres

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: articles_db_network